<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<title>LDU – Aqrar və Mühəndislik fakültəsi | PDF arxivi</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0b2e1e;
  color:#fff;
}
header{text-align:center;padding:20px;font-size:22px}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:15px;
  padding:20px;
}
.card{
  background:rgba(255,255,255,.08);
  backdrop-filter:blur(8px);
  padding:20px;
  border-radius:12px;
  cursor:pointer;
  text-align:center;
}
.hidden{display:none}
.back{cursor:pointer;color:#9cffc7;margin:15px}
.pdf{
  background:rgba(255,255,255,.08);
  padding:10px;
  border-radius:8px;
  margin-bottom:10px;
  display:flex;
  justify-content:space-between;
}
footer{text-align:center;opacity:.6;padding:15px}
</style>
</head>

<body>

<header>LDU – Aqrar və Mühəndislik fakültəsi<br>PDF arxivi</header>

<div id="sections" class="grid"></div>

<div id="pdfView" class="hidden">
  <div class="back" onclick="goBack()">← geri</div>
  <div id="pdfList"></div>
</div>

<footer>by hbnedu.az</footer>

<script>
let data = {};

fetch("pdfs.json")
.then(r=>r.json())
.then(d=>{
  data=d;
  const s=document.getElementById("sections");
  Object.keys(data).forEach(k=>{
    const c=document.createElement("div");
    c.className="card";
    c.innerText=k;
    c.onclick=()=>openSection(k);
    s.appendChild(c);
  });
});

function openSection(name){
  document.getElementById("sections").classList.add("hidden");
  document.getElementById("pdfView").classList.remove("hidden");
  const list=document.getElementById("pdfList");
  list.innerHTML="";
  data[name].forEach(f=>{
    const d=document.createElement("div");
    d.className="pdf";
    d.innerHTML=`
      <span>${f}</span>
      <span>
        <a href="pdf/${name}/${f}" target="_blank">Aç</a>
        |
        <a href="pdf/${name}/${f}" download>Yüklə</a>
      </span>`;
    list.appendChild(d);
  });
}

function goBack(){
  document.getElementById("pdfView").classList.add("hidden");
  document.getElementById("sections").classList.remove("hidden");
}
</script>

</body>
</html>
