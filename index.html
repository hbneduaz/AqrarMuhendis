<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<title>LDU – Aqrar və Mühəndislik fakültəsi | PDF arxivi</title>

<style>
:root{
  --bg1:#071a13;
  --bg2:#0f3d2e;
  --glass:rgba(255,255,255,.1);
  --border:rgba(255,255,255,.18);
  --accent:#9cffc7;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Segoe UI,Arial,sans-serif;
  background:linear-gradient(135deg,var(--bg1),var(--bg2));
  color:#fff;
  min-height:100vh;
}

header{
  text-align:center;
  padding:25px 15px 10px;
  font-size:22px;
  font-weight:600;
}

.search{
  display:flex;
  justify-content:center;
  margin:15px;
}
.search input{
  width:100%;
  max-width:420px;
  padding:12px 16px;
  border-radius:30px;
  border:1px solid var(--border);
  background:var(--glass);
  color:#fff;
  outline:none;
  backdrop-filter:blur(10px);
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
  gap:20px;
  padding:20px;
}

.card{
  background:var(--glass);
  backdrop-filter:blur(12px);
  border-radius:16px;
  padding:25px;
  text-align:center;
  cursor:pointer;
  border:1px solid var(--border);
  position:relative;
  transition:.35s;
  overflow:hidden;
}
.card::before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(120deg,transparent,rgba(255,255,255,.3),transparent);
  opacity:0;
  transition:.4s;
}
.card:hover::before{opacity:1}
.card:hover{transform:translateY(-6px)}

.hidden{display:none}

.back{
  margin:20px;
  color:var(--accent);
  cursor:pointer;
}

.pdf-list{
  max-width:900px;
  margin:auto;
  padding:20px;
}

.pdf-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:var(--glass);
  border:1px solid var(--border);
  border-radius:12px;
  padding:12px 16px;
  margin-bottom:10px;
  backdrop-filter:blur(10px);
}

.pdf-item a{
  color:var(--accent);
  text-decoration:none;
  margin-left:10px;
}

footer{
  text-align:center;
  padding:15px;
  opacity:.65;
}
</style>
</head>

<body>

<header>
LDU – Aqrar və Mühəndislik fakültəsi<br>PDF arxivi
</header>

<div class="search">
  <input id="search" placeholder="Bütün PDF-lər üzrə axtarış">
</div>

<!-- BÖLMƏLƏR -->
<div id="sections" class="grid"></div>

<!-- BÖLMƏ DAXİLİ -->
<div id="sectionView" class="hidden">
  <div class="back" onclick="goBack()">← geri</div>
  <div class="pdf-list" id="pdfList"></div>
</div>

<footer>by hbnedu.az</footer>

<script>
let data = {};
let currentSection = "";

/* JSON avtomatik script tərəfindən yaradılır */
fetch("data.json")
.then(r=>r.json())
.then(j=>{
  data=j;
  renderSections();
});

function renderSections(){
  sections.innerHTML="";
  for(let sec in data){
    let d=document.createElement("div");
    d.className="card";
    d.innerText=sec;
    d.onclick=()=>openSection(sec);
    sections.appendChild(d);
  }
}

function openSection(name){
  currentSection=name;
  sections.classList.add("hidden");
  sectionView.classList.remove("hidden");
  renderPDFs(data[name]);
}

function renderPDFs(list){
  pdfList.innerHTML="";
  list.forEach(p=>{
    let div=document.createElement("div");
    div.className="pdf-item";
    div.innerHTML=`
      <span>${p.name}</span>
      <span>
        <a href="${p.path}" target="_blank">Aç</a>
        <a href="${p.path}" download>Yüklə</a>
      </span>`;
    pdfList.appendChild(div);
  });
}

function goBack(){
  sectionView.classList.add("hidden");
  sections.classList.remove("hidden");
}

/* ÜMUMİ AXTARIŞ */
search.oninput=()=>{
  let q=search.value.toLowerCase();
  if(!q){renderSections();return;}
  sections.innerHTML="";
  for(let sec in data){
    data[sec].forEach(p=>{
      if(p.name.toLowerCase().includes(q)){
        let d=document.createElement("div");
        d.className="card";
        d.innerText=`${p.name} (${sec})`;
        d.onclick=()=>openSection(sec);
        sections.appendChild(d);
      }
    });
  }
};
</script>

</body>
</html>
