<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<title>LDU – Aqrar və Mühəndislik fakültəsi | PDF arxivi</title>

<style>
:root{
  --green1:#061913;
  --green2:#0d3b2e;
  --glass:rgba(255,255,255,0.1);
  --border:rgba(255,255,255,0.2);
  --accent:#9cffc7;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Segoe UI,Arial,sans-serif;
  background:linear-gradient(135deg,var(--green1),var(--green2));
  color:#fff;
  min-height:100vh;
}

/* HEADER */
header{
  text-align:center;
  padding:25px 15px 10px;
  font-size:22px;
  font-weight:600;
}

/* SEARCH */
.search{
  display:flex;
  justify-content:center;
  margin:10px 20px 25px;
}
.search input{
  width:100%;
  max-width:420px;
  padding:12px 16px;
  border-radius:30px;
  border:1px solid var(--border);
  background:var(--glass);
  color:#fff;
  outline:none;
  backdrop-filter:blur(10px);
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
  padding:0 20px 40px;
}

/* CARD */
.card{
  background:var(--glass);
  backdrop-filter:blur(12px);
  border-radius:16px;
  padding:25px 20px;
  text-align:center;
  cursor:pointer;
  border:1px solid var(--border);
  position:relative;
  transition:.35s;
  overflow:hidden;
}

/* nano effect */
.card::before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(120deg,transparent,rgba(255,255,255,.35),transparent);
  opacity:0;
  transition:.4s;
}
.card:hover::before{opacity:1}
.card:hover{transform:translateY(-6px)}

.hidden{display:none}

/* SECTION VIEW */
.back{
  margin:20px;
  color:var(--accent);
  cursor:pointer;
  font-size:16px;
}

.section-title{
  text-align:center;
  font-size:20px;
  margin-bottom:30px;
  opacity:.8;
}

/* FOOTER */
footer{
  text-align:center;
  padding:15px;
  opacity:.7;
}
</style>
</head>

<body>

<!-- 1. ÜST HİSSƏ -->
<header>
LDU-Aqrar və Mühəndislik fakültəsi<br>
PDF arşivi
</header>

<!-- 6. AXTARIŞ -->
<div class="search">
  <input type="text" placeholder="PDF üzrə axtarış">
</div>

<!-- 3. BÖLMƏLƏR -->
<div id="sections" class="grid">
  <div class="card" onclick="openSection('Kompüter mühəndisliyi')">Kompüter mühəndisliyi</div>
  <div class="card" onclick="openSection('İnformasiya texnologiyaları')">İnformasiya texnologiyaları</div>
  <div class="card" onclick="openSection('İnformasiya təhlükəsizliyi')">İnformasiya təhlükəsizliyi</div>
  <div class="card" onclick="openSection('Qida mühəndisliyi')">Qida mühəndisliyi</div>
  <div class="card" onclick="openSection('Şərabçılıq')">Şərabçılıq</div>
  <div class="card" onclick="openSection('Aqromühəndislik')">Aqromühəndislik</div>
  <div class="card" onclick="openSection('Aqronomluq')">Aqronomluq</div>
  <div class="card" onclick="openSection('Bağçılıq və tərəvəzçilik')">Bağçılıq və tərəvəzçilik</div>
  <div class="card" onclick="openSection('Torpaqşünaslıq və aqrokimya')">Torpaqşünaslıq və aqrokimya</div>
  <div class="card" onclick="openSection('Meşəçilik')">Meşəçilik</div>
</div>

<!-- 7. BÖLMƏYƏ GİRİŞ / ÇIXIŞ -->
<div id="sectionView" class="hidden">
  <div class="back" onclick="goBack()">← geri</div>
  <div class="section-title" id="sectionTitle">
    Bu bölməyə aid PDF-lər burada olacaq
  </div>
</div>

<!-- 2. ALT HİSSƏ -->
<footer>
by hbnedu.az
</footer>

<script>
function openSection(name){
  sections.classList.add("hidden");
  sectionView.classList.remove("hidden");
  sectionTitle.innerText = name;
}

function goBack(){
  sectionView.classList.add("hidden");
  sections.classList.remove("hidden");
}
</script>

</body>
</html>
